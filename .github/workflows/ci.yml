name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: make test
      - name: Build (unsigned)
        run: make pane XCODEBUILD_FLAGS="CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= OTHER_CODE_SIGN_FLAGS="
      - name: Check minimum macOS
        run: |
          plutil -extract LSMinimumSystemVersion raw build/pane/Build/Products/Release/Jitouch.prefPane/Contents/Info.plist | grep -x 10.13
          plutil -extract LSMinimumSystemVersion raw build/app/Build/Products/Release/Jitouch.app/Contents/Info.plist | grep -x 10.13
          plutil -extract LSMinimumSystemVersion raw build/app/Build/Products/Release/Jitouch.app/Contents/Frameworks/Sparkle.framework/Resources/Info.plist | grep -x 10.13
      - name: Check architectures
        run: |
          for bin in build/pane/Build/Products/Release/Jitouch.prefPane/Contents/MacOS/Jitouch \
              build/app/Build/Products/Release/Jitouch.app/Contents/MacOS/Jitouch; do
            lipo "$bin" -verify_arch x86_64
            lipo "$bin" -verify_arch arm64
          done
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          brew install cocogitto
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          cog check "origin/$GITHUB_BASE_REF..HEAD"
