# Cocogitto drives releases from Conventional Commits:
# https://docs.cocogitto.io/reference/config.html
tag_prefix = "v"
branch_whitelist = ["main"]
ignore_merge_commits = true
skip_ci = "[skip ci]"

# Write the new version where the build reads it. cog adds the modified files
# to the release commit.
pre_bump_hooks = [
    "sed -E -i '' 's/^(MARKETING_VERSION|CURRENT_PROJECT_VERSION) = .*/\\1 = {{version}}/' Config/Jitouch.xcconfig",
    "sed -E -i '' 's/\"Version [-0-9A-Za-z.]*\"/\"Version {{version}}\"/' prefpane/Base.lproj/JitouchPref.xib",
]

[commit_types]
# Housekeeping neither appears in the changelog and update notes nor triggers
# a release on its own.
chore = { changelog_title = "Miscellaneous Chores", omit_from_changelog = true, bump_patch = false }
ci = { changelog_title = "Continuous Integration", omit_from_changelog = true, bump_patch = false }
build = { changelog_title = "Build System", omit_from_changelog = true, bump_patch = false }
test = { changelog_title = "Tests", omit_from_changelog = true, bump_patch = false }
docs = { changelog_title = "Documentation", omit_from_changelog = true, bump_patch = false }
style = { changelog_title = "Style", omit_from_changelog = true, bump_patch = false }
refactor = { changelog_title = "Refactoring", omit_from_changelog = true, bump_patch = false }

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "tonioriol"
repository = "Jitouch"
